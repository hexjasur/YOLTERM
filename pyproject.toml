[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolterm"
version = "0.1.0"
description = "A modern developer terminal for Windows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "YOLTERM Contributors" }]
dependencies = [
    "PySide6>=6.7,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
